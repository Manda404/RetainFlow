resources:
  jobs:
    retainflow_end_to_end_workflow:
      name: retainflow_end_to_end_workflow
      max_concurrent_runs: 1
      tags:
        project: RetainFlow
        stage: dev
        owner: data_science
      tasks:
        - task_key: phase1_data_pipeline
          description: Create/update Unity Catalog model and generate Phase 1 data.
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${var.workspace_dir}/23_run_phase1_pipeline_databricks

        - task_key: train_churn_model
          description: Train CatBoost churn model and write churn predictions.
          depends_on:
            - task_key: phase1_data_pipeline
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${var.workspace_dir}/01_train_churn_model

        - task_key: build_retention_priority_queue
          description: Convert churn predictions into retention recommendations.
          depends_on:
            - task_key: train_churn_model
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${var.workspace_dir}/01_build_retention_priority_queue

        - task_key: run_monitoring_dashboard_checks
          description: Run monitoring dashboard queries after recommendations are created.
          depends_on:
            - task_key: build_retention_priority_queue
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${var.workspace_dir}/01_monitoring_dashboard
