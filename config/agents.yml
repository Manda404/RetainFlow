project: RetainFlow
environment: local

llm:
  provider_env: LLM_PROVIDER
  model_env: LLM_MODEL
  enabled_env: RETAINFLOW_LLM_ENABLED
  default_provider: groq
  default_model: llama-3.3-70b-versatile
  api_key_env_by_provider:
    groq: GROQ_API_KEY
    openai: OPENAI_API_KEY
  enabled: true

database:
  dsn_env: RETAINFLOW_POSTGRES_DSN
  read_only: true
  default_limit: 200

model:
  name_env: RETAINFLOW_MODEL_NAME
  api_url_env: RETAINFLOW_MODEL_API_URL
  use_persisted_predictions_first: true

rag:
  docs_dir_env: RETAINFLOW_RAG_DOCS_DIR
  default_docs_dir: data/docs/strategy_marketing
  top_k: 5

visualization:
  default_engine: plotly_express
  fallback_engines:
    - seaborn
    - matplotlib
  default_width: 1100
  default_height: 520

guardrails:
  sql_allowed_statements:
    - SELECT
    - WITH
  sql_blocked_keywords:
    - ALTER
    - CREATE
    - DELETE
    - DROP
    - INSERT
    - MERGE
    - TRUNCATE
    - UPDATE
  require_human_email_approval: true
  include_sql_source_in_answers: true
  include_mlflow_run_id_in_model_answers: true
  include_shap_drivers_in_prediction_answers: true
