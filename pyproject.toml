[project]
name = "retainflow"
version = "0.1.0"
description = "Synthetic French insurance data platform for churn prediction, retention prioritization, and future agentic SQL workflows on PostgreSQL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Surel Manda" },
]
dependencies = [
    "faker>=33.3.1,<34.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "numpy>=2.2.1,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pyarrow>=18.1.0,<19.0.0",
    "catboost>=1.2.7,<2.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "scipy>=1.14.1,<2.0.0",
    "mlflow (==3.14.0)",
    "shap>=0.46.0,<1.0.0",
    "pydantic>=2.10.4,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[tool.poetry]
packages = [{ include = "retainflow", from = "src" }]

[project.scripts]
retainflow-build-data = "retainflow.pipelines.build_dataset:main"
retainflow-train-churn = "retainflow.pipelines.train_churn:main"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
jupyterlab = "^4.3.4"
pytest = "^8.3.4"
ruff = "^0.8.6"
mypy = "^1.14.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[tool.retainflow.postgres]
dsn_env = "RETAINFLOW_POSTGRES_DSN"
default_dsn = "postgresql://retainflow:retainflow@localhost:55432/retainflow"
schema = "retainflow"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
